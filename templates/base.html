{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{% block meta_description %}BrizZ — Custom HyperOS/AOSP ROM builds, Magisk modules, and Android customization.{% endblock %}">
    <title>{% block title %}BrizZ{% endblock %}</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Global stylesheet -->
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">

    <!-- Page-specific stylesheets -->
    {% block extra_css %}{% endblock %}
</head>
<body>
    <header class="navbar">
        <a href="{% url 'core:home' %}" class="logo">BrizZ</a>
        <nav aria-label="Main navigation">
            <ul class="nav-links">
                <li><a href="{% url 'core:home' %}"          class="{% if request.path == '/' %}active{% endif %}">Home</a></li>
                <li><a href="{% url 'devices:device_list' %}" class="{% if 'devices' in request.path %}active{% endif %}">Devices</a></li>
                <li><a href="{% url 'tweaks:tweak_list' %}"  class="{% if 'tweaks' in request.path %}active{% endif %}">Tweaks</a></li>
                <li><a href="{% url 'blog:post_list' %}"     class="{% if 'blog' in request.path %}active{% endif %}">Blog</a></li>
                <li><a href="{% url 'core:about_page' %}"    class="{% if 'about' in request.path %}active{% endif %}">About</a></li>
            </ul>
        </nav>
        <button class="hamburger" aria-label="Toggle navigation" aria-expanded="false">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </button>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <p>&copy; {% now "Y" %} BrizZ Team &mdash; Custom Android ROMs &amp; Tweaks</p>
    </footer>

    <script>
        const hamburger = document.querySelector('.hamburger');
        const navLinks  = document.querySelector('.nav-links');

        hamburger.addEventListener('click', () => {
            const isOpen = navLinks.classList.toggle('active');
            hamburger.classList.toggle('active');
            hamburger.setAttribute('aria-expanded', isOpen);
        });

        // Close mobile nav when a link is clicked
        navLinks.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => {
                navLinks.classList.remove('active');
                hamburger.classList.remove('active');
                hamburger.setAttribute('aria-expanded', 'false');
            });
        });
    </script>
</body>
</html>
